<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Afsar's AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div class="chat-container">

        <!-- Header -->

        <div class="chat-header">

            <div class="profile">

                <div class="ai-avatar">
                    🤖
                </div>

                <div class="profile-info">
                    <h2>Afsar's AI Assistant</h2>

                    <div class="status">
                        <span class="status-dot"></span>
                        AI Assistant • Online
                    </div>
                </div>

            </div>

        </div>


        <!-- Chat -->

        <div class="chat-box" id="chat-box">

            <div class="welcome-card">

                <div class="welcome-icon">
                    👋
                </div>

                <h3>Hello! I'm Afsar's AI Assistant</h3>

                <p>
                    Ask me about Afsar's skills, projects,
                    education or career interests.
                </p>

            </div>

        </div>


        <!-- Quick Questions -->

        <div class="quick-questions">

            <button onclick="quickQuestion('What are Afsar technical skills?')">
                💻 Skills
            </button>

            <button onclick="quickQuestion('Tell me about Afsar projects.')">
                🚀 Projects
            </button>

            <button onclick="quickQuestion('Why did Afsar build this chatbot?')">
                🤖 About Chatbot
            </button>

        </div>


        <!-- Input -->

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Ask me anything about Afsar..."
                autocomplete="off"
            >

            <button
                class="send-button"
                onclick="sendMessage()"
            >
                ➤
            </button>

            <button
                class="clear-button"
                onclick="clearChat()"
            >
                Clear
            </button>

        </div>


        <div class="footer">
            Powered by Gemini AI
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
